name: Deploy KivitsGoesPro to GitHub Pages

on:
  push:
    branches: [BlackBooxV4]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild static site safely
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, tarfile

          parts = [Path(f"bundle.part{i:02d}") for i in range(12)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing bundle parts: {missing}")

          encoded = "".join(p.read_text(encoding="utf-8") for p in parts)
          encoded = "".join(encoded.split())
          archive = base64.b64decode(encoded, validate=True)

          target = Path("_site")
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as tar:
              target_root = target.resolve()
              for member in tar.getmembers():
                  resolved = (target / member.name).resolve()
                  if target_root not in resolved.parents and resolved != target_root:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              tar.extractall(target)

          required = [
              "index.html", "app.js", "auth.js", "styles.css",
              "manifest.json", "service-worker.js",
              "assets/kivits-goes-logo.jpg", "assets/default-avatar.svg",
          ]
          missing_files = [name for name in required if not (target / name).is_file()]
          if missing_files:
              raise SystemExit(f"Missing rebuilt files: {missing_files}")
          (target / ".nojekyll").touch()
          print(f"Rebuilt {len(required)} required files successfully")
          PY

      - name: Validate JavaScript and manifest
        run: |
          node --check _site/app.js
          node --check _site/auth.js
          python3 -m json.tool _site/manifest.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/pages-marker.b64
          import base64, json, os
          payload = {
              "status": "deployed",
              "run_id": os.environ["RUN_ID"],
              "page_url": os.environ["PAGE_URL"],
              "commit_sha": os.environ["COMMIT_SHA"],
          }
          print(base64.b64encode((json.dumps(payload, indent=2) + "\n").encode()).decode())
          PY
          EXISTING_SHA="$(gh api "repos/$REPO/contents/.pages-deployed-latest.json?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/.pages-deployed-latest.json" \
              -f message='Record successful Pages deployment [skip ci]' \
              -f content="$(cat /tmp/pages-marker.b64)" \
              -f branch="$BRANCH" \
              -f sha="$EXISTING_SHA"
          else
            gh api --method PUT "repos/$REPO/contents/.pages-deployed-latest.json" \
              -f message='Record successful Pages deployment [skip ci]' \
              -f content="$(cat /tmp/pages-marker.b64)" \
              -f branch="$BRANCH"
          fi
