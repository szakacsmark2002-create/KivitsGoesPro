name: Deploy KivitsGoesPro Business Control

on:
  push:
    branches: [BlackBooxV4]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild base application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, tarfile
          parts = [Path(f"bundle.part{i:02d}") for i in range(12)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f"Missing base bundle parts: {missing}")
          encoded = "".join(p.read_text(encoding="utf-8") for p in parts)
          archive = base64.b64decode("".join(encoded.split()), validate=True)
          target = Path("_site")
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as tar:
              root = target.resolve()
              for member in tar.getmembers():
                  resolved = (target / member.name).resolve()
                  if root not in resolved.parents and resolved != root:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              tar.extractall(target)
          PY

      - name: Apply Business Control 1.4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, traceback

          js_parts = [Path(f"business14.js.gz.b64x.part{i:02d}") for i in range(3)]
          css_parts = [Path("business14.css.gz.b64x.part00")]
          all_parts = js_parts + css_parts
          diagnostics = {}
          for path in all_parts:
              data = path.read_bytes()
              diagnostics[path.name] = {
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          Path("/tmp/business14-diagnostics.json").write_text(json.dumps(diagnostics, indent=2), encoding="utf-8")

          def decode_patch(parts):
              inner_b64 = b"".join(base64.b64decode(path.read_bytes(), validate=True) for path in parts)
              compressed = base64.b64decode(b"".join(inner_b64.split()), validate=True)
              return gzip.decompress(compressed)

          try:
              js = decode_patch(js_parts)
              css = decode_patch(css_parts)
              Path("/tmp/business14.js").write_bytes(js)
              Path("_site/business14.css").write_bytes(css)
              with Path("_site/app.js").open("ab") as handle:
                  handle.write(b"\n")
                  handle.write(js)
              Path("_site/.nojekyll").touch()
          except Exception as exc:
              Path("/tmp/business14-error.txt").write_text(f"{type(exc).__name__}: {exc}\n{traceback.format_exc()}", encoding="utf-8")
              raise
          PY

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/auth.js
          test -f _site/styles.css
          test -f _site/business14.css
          test -f _site/manifest.json
          test -f _site/assets/kivits-goes-logo.jpg
          node --check _site/app.js
          node --check _site/auth.js
          python3 -m json.tool _site/manifest.json >/dev/null
          grep -q "BUSINESS CONTROL 1.4" _site/app.js
          grep -q "Business Control Center" _site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Record build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/build-marker.b64
          import base64, json, os
          from pathlib import Path
          diagnostics = {}
          if Path('/tmp/business14-diagnostics.json').exists():
              diagnostics = json.loads(Path('/tmp/business14-diagnostics.json').read_text())
          payload = {
              "stage": "build",
              "release": "Business Control 1.4",
              "result": os.environ["RESULT"],
              "run_id": os.environ["RUN_ID"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "error": Path('/tmp/business14-error.txt').read_text() if Path('/tmp/business14-error.txt').exists() else "",
              "diagnostics": diagnostics,
          }
          print(base64.b64encode((json.dumps(payload, indent=2) + "\n").encode()).decode())
          PY
          SHA="$(gh api "repos/$REPO/contents/.pages-build-latest.json?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/.pages-build-latest.json" -f message='Record Business 1.4 build [skip ci]' -f content="$(cat /tmp/build-marker.b64)" -f branch="$BRANCH" -f sha="$SHA"
          else
            gh api --method PUT "repos/$REPO/contents/.pages-build-latest.json" -f message='Record Business 1.4 build [skip ci]' -f content="$(cat /tmp/build-marker.b64)" -f branch="$BRANCH"
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/deploy-marker.b64
          import base64, json, os
          payload = {
              "stage": "deploy",
              "release": "Business Control 1.4",
              "result": os.environ["RESULT"],
              "run_id": os.environ["RUN_ID"],
              "page_url": os.environ.get("PAGE_URL", ""),
              "commit_sha": os.environ["COMMIT_SHA"],
          }
          print(base64.b64encode((json.dumps(payload, indent=2) + "\n").encode()).decode())
          PY
          SHA="$(gh api "repos/$REPO/contents/.pages-deploy-latest.json?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/.pages-deploy-latest.json" -f message='Record Business 1.4 deploy [skip ci]' -f content="$(cat /tmp/deploy-marker.b64)" -f branch="$BRANCH" -f sha="$SHA"
          else
            gh api --method PUT "repos/$REPO/contents/.pages-deploy-latest.json" -f message='Record Business 1.4 deploy [skip ci]' -f content="$(cat /tmp/deploy-marker.b64)" -f branch="$BRANCH"
          fi
